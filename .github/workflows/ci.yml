name: Проверки

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            sdk: none
          - node: '26.13.0'
            sdk: '2026.11.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --omit=peer
      - if: matrix.sdk != 'none'
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund openclaw@${{ matrix.sdk }}
      - run: npm run typecheck
      - run: npm test
        env:
          REQUIRE_OPENCLAW_SDK: ${{ matrix.sdk != 'none' && '1' || '' }}
      - run: npm run build
